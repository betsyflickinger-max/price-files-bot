name: Test a regional split (featured codes)

# Oct 31, 2026: splits a state's build into its regions for the 89 featured codes only (site/region_split.py, SPLIT_TEST=1:
# no split.json, so the publish step doesn't use it), then checks every regional row against the state build
# (site/region_verify.py). Writes only the regions' own build folders; deploys nothing.
on:
  push:                     # Oct 31, 2026: also runs for each state listed in site/region_test_states.txt when that file changes
    branches: [main]
    paths: [site/region_test_states.txt]
  workflow_dispatch:
    inputs:
      state:
        description: "State page slug split into regions"
        default: "california"
      verify_only:
        description: "Skip the split, only check"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  states:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "list=$(python3 -c "import json;print(json.dumps([l.strip() for l in open('site/region_test_states.txt') if l.strip() and not l.startswith('#')]))")" >> "$GITHUB_OUTPUT"
          else
            echo "list=[\"${{ inputs.state }}\"]" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: states
    strategy:
      fail-fast: false
      matrix:
        st: ${{ fromJSON(needs.states.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ST: ${{ matrix.st }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3
      - name: Split (featured codes)
        if: inputs.verify_only != true
        run: SPLIT_TEST=1 python site/region_split.py "$ST"
      - name: Check against the state build
        run: python site/region_verify.py "$ST"
