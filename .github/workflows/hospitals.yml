name: Hospital price files

on:
  schedule:
    - cron: "17 9 * * *"   # every day, 4:17am Central (each hospital comes up about once a week)
  workflow_dispatch:
    inputs:
      states:
        description: "Only these states, comma-separated (blank = all)"
        required: false
        default: ""
      all:
        description: "Check every hospital in those states, not just the ones due today"
        type: boolean
        default: false
      limit:
        description: "Max files per state (0 = no limit; use 2-3 for a test)"
        required: false
        default: "0"

concurrency:
  group: hospital-price-files
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.s.outputs.states }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os
          want = [s.strip().upper() for s in os.environ.get("WANT", "").split(",") if s.strip()]
          have = sorted({r["state"] for r in csv.DictReader(open("data/hospitals.csv"))})
          print("states=" + json.dumps([s for s in have if not want or s in want]))
          PY
        env:
          WANT: ${{ inputs.states }}

  check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345          # GitHub's limit is 6 hours per job
    strategy:
      fail-fast: false
      max-parallel: 20            # free plan: 20 jobs at once
      matrix:
        state: ${{ fromJson(needs.plan.outputs.states) }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - name: Make room on the disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check ${{ matrix.state }}
        run: |
          test -n "$R2_ACCOUNT_ID" || { echo "::error::R2 secrets are not set (repo Settings > Secrets and variables > Actions)"; exit 1; }
          ARGS="--state ${{ matrix.state }} --minutes 300 --limit ${{ inputs.limit || '0' }}"
          [ "${{ inputs.all }}" = "true" ] && ARGS="$ARGS --all"
          python bot/run.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-${{ matrix.state }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore

  summarize:
    needs: check
    if: always() && needs.check.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot/summarize.py
      - run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue for new problems
        run: |
          if [ -f out/alerts.md ]; then
            gh label create price-file-alert --color B22222 --description "Broken, missing or shrunken hospital price files" 2>/dev/null || true
            gh issue create --title "New price-file problems $(date -u +%F)" --body-file out/alerts.md --label price-file-alert
          fi

  keepalive:
    # GitHub pauses scheduled runs on a repo with no commits for 60 days.
    # If the last commit is 45+ days old, make an empty one so the daily run never stops.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((45*24*3600)) ]; then
            git config user.name "price-files-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the daily run active"
            git push
          else
            echo "Recent commit found; nothing to do."
          fi
