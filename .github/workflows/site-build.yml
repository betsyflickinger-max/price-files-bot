name: Website refresh (monthly)

on:
  schedule:
    - cron: "29 */6 * * *"   # every 6 hours: move the month's build along (starts on the 8th)
  workflow_dispatch:
    inputs:
      force:
        description: "Start this month's build now (skip the 8th-of-the-month and insurer-bot waits)"
        type: boolean
        default: false
      build:
        description: "Build id YYYY-MM (blank = this month)"
        required: false
        default: ""

concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force && '1' || '' }}
      BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36
      - run: python site/orchestrate.py | tee -a "$GITHUB_STEP_SUMMARY"
