name: Insurer price files

on:
  schedule:
    - cron: "47 */6 * * *"   # every 6 hours: full check for new insurer files
    - cron: "*/10 * * * *"   # every 10 minutes: collect finished results and put waiting files on any free machine
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check for new files but rent no machines and change nothing"
        type: boolean
        default: true
      scope:
        description: "Area: dfw (the live DFW tables) or tx (all of Texas, written to data/tx/)"
        default: "dfw"
      fill:
        description: "Quick fill only (collect results, start waiting files on free machines; used by finished machines)"
        type: boolean
        default: false
      only:
        description: "Only these networks (slot names from insurers/networks.csv, comma-separated; blank = all)"
        required: false
        default: ""

concurrency:
  group: insurer-price-files
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  insurers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the machines' GitHub token (manual runs)
        if: github.event_name == 'workflow_dispatch' && !inputs.fill
        run: |
          T=$(echo -n "$BOT_GITHUB_TOKEN" | tr -d '[:space:]')
          if [ -z "$T" ]; then echo "::warning::BOT_GITHUB_TOKEN is not set: free machines are filled by the 10-minute pass only."; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" https://api.github.com/repos/${{ github.repository }}/actions/workflows/insurers.yml)
          echo "BOT_GITHUB_TOKEN check: HTTP $code (200 = works)"
          [ "$code" = "200" ] || echo "::warning::BOT_GITHUB_TOKEN did not work (HTTP $code). Check its repository access and the Actions permission."
      - name: Check insurer files
        run: |
          ARGS=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          ARGS="$ARGS --scope ${{ inputs.scope || 'dfw' }}"
          [ "${{ github.event.schedule }}" = "*/10 * * * *" ] && ARGS="$ARGS --fill"
          [ "${{ inputs.fill }}" = "true" ] && ARGS="$ARGS --fill"
          if [ -z "$DIGITALOCEAN_TOKEN" ] && [[ "$ARGS" != *--dry-run* ]]; then
            echo "::warning::DIGITALOCEAN_TOKEN is not set, so this run only checks (no machines rented)."
            ARGS="--dry-run"
          fi
          python insurers/bot.py $ARGS
      - name: All of Texas (scheduled runs only; manual runs use the inputs above)
        if: github.event_name == 'schedule' || inputs.fill
        run: |
          cp out/insurer_summary.md out/insurer_summary_dfw.md
          [ -f out/insurer_alerts.md ] && mv out/insurer_alerts.md out/insurer_alerts_dfw.md
          FILL=""; [ "${{ github.event.schedule }}" = "*/10 * * * *" ] && FILL="--fill"
          [ "${{ inputs.fill }}" = "true" ] && FILL="--fill"
          python insurers/bot.py --scope tx $FILL
          cat out/insurer_summary_dfw.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/insurer_alerts_dfw.md ] && cat out/insurer_alerts_dfw.md >> out/insurer_alerts.md || true
      - run: cat out/insurer_summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - name: Open an issue for problems
        if: always() && github.event.schedule != '*/10 * * * *' && !inputs.fill
        run: |
          if [ -f out/insurer_alerts.md ]; then
            gh label create insurer-file-alert --color B22222 --description "Insurer file failed, shrank, or went stale" 2>/dev/null || true
            gh issue create --title "Insurer file problems $(date -u +%F)" --body-file out/insurer_alerts.md --label insurer-file-alert
          fi
