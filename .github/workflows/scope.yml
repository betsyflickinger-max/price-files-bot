name: Build provider list

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Two-letter state (builds every provider practicing there from the federal NPI registry)"
        default: "TX"

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyarrow==26.0.0
      - run: python insurers/build_scope.py ${{ inputs.state }}
