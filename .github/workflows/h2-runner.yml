name: Hospital prices for one area on a GitHub machine

# Oct 31, 2026: builds one area's hospital price files (site/hosp_area.py h2, same as on a rented machine) on a free GitHub
# machine, for when the rented-machine limit is full (the insurer reader's machines are mid-file). Writes the same files and
# h2/<area>.done marker; the next page run publishes the area. No site deploy here, so no site lock.
on:
  workflow_dispatch:
    inputs:
      area:
        description: "Area slug, e.g. central-california"
      sp:
        description: "Hospital build folder, e.g. site/builds/hosp-stn5-2026-10/"

permissions:
  contents: read

jobs:
  h2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AREA_IN: ${{ inputs.area }}
      SP: ${{ inputs.sp }}
      NP: "4"
      MEM: "11GB"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 ijson zstandard
      - run: sudo mkdir -p /d && sudo chown "$USER" /d
      - run: |
          # the rented machines get these values without spaces or line breaks (orchestrate.py userdata); h2_build.py expects that
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do export "$k=$(printf %s "${!k}" | tr -d '[:space:]')"; done
          python site/hosp_area.py h2 "$AREA_IN"
          python - <<'PY2'
          import os, boto3, sys
          g = lambda k: os.environ[k]
          s3 = boto3.client('s3', endpoint_url=(os.environ.get('STORAGE_ENDPOINT') or f"https://{g('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com"), aws_access_key_id=g('R2_ACCESS_KEY_ID'),
                            aws_secret_access_key=g('R2_SECRET_ACCESS_KEY'), region_name=(os.environ.get('STORAGE_REGION') or 'auto'))
          try: s3.head_object(Bucket=g('R2_BUCKET'), Key=os.environ['SP'] + 'h2/' + os.environ['AREA_IN'] + '.done'); print('done marker written')
          except Exception: sys.exit('no done marker: the hospital build did not finish')
          PY2
