name: Proof of procedures - price page preview (no deploy)

# Oct 31, 2026 (card #2): before/after of one area's price pages (default Illinois; DFW first) with proof (site/proof.py) switched on. Deploys nothing;
# writes reports/proof-preview/dfw.md. Runs on a change to the preview or proof code, or by hand.

on:
  push:
    branches: [main]
    paths: [site/proof_preview.py, site/proof.py, .github/workflows/proof-preview.yml]
  workflow_dispatch:
    inputs:
      area:
        description: "Area to preview (e.g. dfw, illinois)"
        default: "illinois"

concurrency:
  group: proof-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONUNBUFFERED: "1"
      PROOF_PREVIEW_AREA: ${{ inputs.area }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 pillow==10.4.0 pyarrow==26.0.0
      - run: python site/proof_preview.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the preview
        if: always()
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/proof-preview 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "Proof of procedures preview $(date -u +%F)"; git pull -q --rebase origin main; git push -q origin HEAD:main; }
